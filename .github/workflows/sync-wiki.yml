name: Sync Docs to GitHub Wiki

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Publish docs/wiki to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Push markdown pages to Wiki repository (if initialized)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "$WIKI_URL" >/dev/null 2>&1; then
            echo "::notice::GitHub Wiki git repository is not initialized yet. Click 'Wiki -> Create the first page -> Save Page' once on GitHub, then re-run this workflow to populate all Wiki pages automatically."
            exit 0
          fi
          git clone "$WIKI_URL" /tmp/wiki-repo
          rm -rf /tmp/wiki-repo/*.md
          cp docs/wiki/*.md /tmp/wiki-repo/
          cd /tmp/wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
          else
            git commit -m "docs(wiki): sync Wiki pages from docs/wiki (${GITHUB_SHA::7})"
            git push origin HEAD
          fi
